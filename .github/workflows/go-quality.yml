name: Go quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Verify dependency integrity and tidy state
        shell: bash
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build SDK and examples
        run: go build ./...
      - name: Vet SDK and examples
        run: go vet ./...
      - name: Offline unit tests
        run: go test -count=1 -shuffle=on ./...
      - name: Race detection
        env:
          CGO_ENABLED: '1'
          MSTEAMS_CONTRACT_REVISION: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/go-test-artifacts"
          go test -race -count=1 -shuffle=on -artifacts -outputdir "$RUNNER_TEMP/go-test-artifacts" ./...
      - name: Retain sanitized offline contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-contracts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/go-test-artifacts/**/core-primitives.json
            ${{ runner.temp }}/go-test-artifacts/**/channel-service.json
            ${{ runner.temp }}/go-test-artifacts/**/channel-member-service.json
            ${{ runner.temp }}/go-test-artifacts/**/channel-user-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-operation-service.json
            ${{ runner.temp }}/go-test-artifacts/**/shared-channel-service.json
            ${{ runner.temp }}/go-test-artifacts/**/shared-channel-management-service.json
            ${{ runner.temp }}/go-test-artifacts/**/targeting-policy-service.json
            ${{ runner.temp }}/go-test-artifacts/**/targeting-hierarchy-service.json
            ${{ runner.temp }}/go-test-artifacts/**/batch-deployment-service.json
            ${{ runner.temp }}/go-test-artifacts/**/multi-geo-region-service.json
            ${{ runner.temp }}/go-test-artifacts/**/private-channel-migration-service.json
            ${{ runner.temp }}/go-test-artifacts/**/application-meeting-configuration-service.json
            ${{ runner.temp }}/go-test-artifacts/**/external-access-policy-service.json
            ${{ runner.temp }}/go-test-artifacts/**/acs-federation-configuration-service.json
            ${{ runner.temp }}/go-test-artifacts/**/teams-external-access-configuration-service.json
            ${{ runner.temp }}/go-test-artifacts/**/tenant-federation-configuration-service.json
            ${{ runner.temp }}/go-test-artifacts/**/assignment-migration-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-template-service.json
            ${{ runner.temp }}/go-test-artifacts/**/application-access-policy-service.json
            ${{ runner.temp }}/go-test-artifacts/**/application-access-policy-list-service.json
            ${{ runner.temp }}/go-test-artifacts/**/application-access-policy-failure-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-member-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-user-add-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-user-list-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-user-remove-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-get-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-update-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-archive-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-create-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-list-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-delete-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-picture-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-create-settings-service.json
            ${{ runner.temp }}/go-test-artifacts/**/team-update-settings-service.json
          if-no-files-found: error
          retention-days: 14
      - name: Run credential-free example
        run: go run ./examples/baseline
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Check reachable vulnerabilities (including tests)
        run: go tool govulncheck -test ./...
