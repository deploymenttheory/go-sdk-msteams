name: Capability ledger

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Exercise coverage failure boundaries
        run: python -m unittest discover -s tools/coverage/tests -v
      - name: Validate all capability evidence and ownership
        run: python tools/coverage/ledger.py
      - name: Verify EXT command, parameter-set and nested candidate inventory
        run: python tools/coverage/ext_report.py --check
      - name: Verify CALL command and parameter-set inventory
        run: python tools/coverage/call_report.py --check
