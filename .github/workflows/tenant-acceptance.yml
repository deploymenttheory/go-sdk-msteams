name: Tenant acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: msteams-lab-tenant-acceptance
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  lab:
    name: Lab (${{ matrix.auth }})
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    strategy:
      fail-fast: false
      matrix:
        auth: [certificate, client-secret]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MSTEAMS_LAB_AUTH_METHOD: ${{ matrix.auth }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Verify test categories and acceptance guards
        run: |
          python3 tools/acceptance/ci.py check-names
          python3 -m unittest discover -s tools/acceptance/tests -v
      - name: Prepare private identity and checksum-pinned PowerShell oracle
        env:
          MSTEAMS_LAB_TENANT_ID: ${{ secrets.MSTEAMS_LAB_TENANT_ID }}
          MSTEAMS_LAB_CLIENT_ID: ${{ secrets.MSTEAMS_LAB_CLIENT_ID }}
          MSTEAMS_LAB_CLIENT_SECRET: ${{ secrets.MSTEAMS_LAB_CLIENT_SECRET }}
          MSTEAMS_LAB_CERTIFICATE_PEM: ${{ secrets.MSTEAMS_LAB_CERTIFICATE_PEM }}
          MSTEAMS_LAB_PRIVATE_KEY_PEM: ${{ secrets.MSTEAMS_LAB_PRIVATE_KEY_PEM }}
          MSTEAMS_LAB_RECOVERY_CERTIFICATE_PEM: ${{ secrets.MSTEAMS_LAB_RECOVERY_CERTIFICATE_PEM }}
        run: python3 tools/acceptance/ci.py prepare
      - name: Run real authentication, resource reads and owned-policy CRUD
        run: python3 tools/acceptance/ci.py run --report-directory "$RUNNER_TEMP/acceptance-report"
      - name: Seal recovery journals and remove private runner files
        if: always() && env.MSTEAMS_LAB_PRIVATE_DIRECTORY != ''
        run: python3 tools/acceptance/ci.py finalize --report-directory "$RUNNER_TEMP/acceptance-report"
      - name: Retain structural results and encrypted recovery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tenant-acceptance-${{ matrix.auth }}
          path: |
            ${{ runner.temp }}/acceptance-report/*.json
            ${{ runner.temp }}/acceptance-report/recovery.cms
          if-no-files-found: error
          retention-days: 14
  result:
    name: Acceptance result
    if: always()
    needs: [lab]
    runs-on: ubuntu-latest
    steps:
      - name: Require executed successful acceptance on a trusted source
        env:
          LAB_RESULT: ${{ needs.lab.result }}
        run: |
          if [ "$LAB_RESULT" != success ]; then
            echo "Tenant acceptance did not pass. Missing credentials, unavailable fixtures, skips and failures do not qualify the selected operations."
            exit 1
          fi
