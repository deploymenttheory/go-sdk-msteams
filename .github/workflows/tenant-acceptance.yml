name: Acceptance tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: 'Run only these service partitions (comma-separated teams_admin_api names); the auth partition always runs'
        type: string
        required: false
      skip_tests:
        description: 'Exact TestAcc names to skip, separated by commas'
        type: string
        required: false
      skip_reason:
        description: 'Public reason for these skips (required with skip_tests)'
        type: string
        required: false
      include_tests:
        description: 'Run these exact tests currently skipped in tools/acceptance/skips.json'
        type: string
        required: false

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local
  PYTHONUNBUFFERED: '1'
  MSTEAMS_ACC_SERVICES: ${{ inputs.services || '' }}
  MSTEAMS_ACC_SKIP_TESTS: ${{ inputs.skip_tests || '' }}
  MSTEAMS_ACC_SKIP_REASON: ${{ inputs.skip_reason || '' }}
  MSTEAMS_ACC_INCLUDE_TESTS: ${{ inputs.include_tests || '' }}

jobs:
  plan:
    name: TestAcc plan
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      services: ${{ steps.plan.outputs.services }}
      services_unlocked: ${{ steps.plan.outputs.services_unlocked }}
      services_locked: ${{ steps.plan.outputs.services_locked }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          # The PR merge commit and its base parent, for the changed-file plan.
          fetch-depth: 2
      - name: Check TestUnit and TestAcc names
        run: |
          python3 tools/acceptance/ci.py check-names
          python3 -m unittest discover -s tools/acceptance/tests -v
      - name: Plan auth and service partitions
        id: plan
        env:
          # Pull requests run only the service partitions they touch (all of
          # them for shared changes); pushes to main run every partition.
          MSTEAMS_ACC_DIFF_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: python3 tools/acceptance/ci.py plan

  # The one auth partition loads every credential kind and proves each
  # (client secret and certificate). Service partitions below use the
  # client secret only.
  auth:
    name: TestAcc auth
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MSTEAMS_LAB_AUTH_METHOD: all
      ACCEPTANCE_TARGET: --auth
      ACCEPTANCE_LABEL: auth
    steps: &partition-steps
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
      - name: Restore MicrosoftTeams 8.1.0 download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/microsoftteams-8.1.0
          key: microsoftteams-8.1.0-${{ hashFiles('tools/baseline/baseline.py') }}
      - name: Load repository secrets and MicrosoftTeams 8.1.0
        env:
          MSTEAMS_LAB_TENANT_ID: ${{ secrets.MSTEAMS_LAB_TENANT_ID }}
          MSTEAMS_LAB_CLIENT_ID: ${{ secrets.MSTEAMS_LAB_CLIENT_ID }}
          MSTEAMS_LAB_CLIENT_SECRET: ${{ secrets.MSTEAMS_LAB_CLIENT_SECRET }}
          # Certificate key material reaches the auth partition only.
          MSTEAMS_LAB_CERTIFICATE_PEM: ${{ env.MSTEAMS_LAB_AUTH_METHOD == 'all' && secrets.MSTEAMS_LAB_CERTIFICATE_PEM || '' }}
          MSTEAMS_LAB_PRIVATE_KEY_PEM: ${{ env.MSTEAMS_LAB_AUTH_METHOD == 'all' && secrets.MSTEAMS_LAB_PRIVATE_KEY_PEM || '' }}
          MSTEAMS_LAB_USER_FIXTURE_JSON: ${{ secrets.MSTEAMS_LAB_USER_FIXTURE_JSON }}
          MSTEAMS_LAB_GROUP_FIXTURE_JSON: ${{ secrets.MSTEAMS_LAB_GROUP_FIXTURE_JSON }}
          MSTEAMS_LAB_CALL_HOLD_AUDIO_FILE_ID: ${{ secrets.MSTEAMS_LAB_CALL_HOLD_AUDIO_FILE_ID }}
          MSTEAMS_LAB_RECOVERY_CERTIFICATE_PEM: ${{ secrets.MSTEAMS_LAB_RECOVERY_CERTIFICATE_PEM }}
          MSTEAMS_LAB_SHARED_CALLING_FIXTURE_JSON: ${{ secrets.MSTEAMS_LAB_SHARED_CALLING_FIXTURE_JSON }}
        run: python3 tools/acceptance/ci.py prepare --cache-directory "$RUNNER_TEMP/microsoftteams-8.1.0"
      - name: Run TestAcc tests
        # ACCEPTANCE_TARGET is a fixed flag pair set by this workflow.
        run: python3 tools/acceptance/ci.py run $ACCEPTANCE_TARGET --report-directory "$RUNNER_TEMP/acceptance-report"
      - name: Save recovery journals and remove credentials
        if: always() && env.MSTEAMS_LAB_PRIVATE_DIRECTORY != ''
        run: python3 tools/acceptance/ci.py finalize --report-directory "$RUNNER_TEMP/acceptance-report"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tenant-acceptance-${{ env.ACCEPTANCE_LABEL }}
          path: |
            ${{ runner.temp }}/acceptance-report/*.json
            ${{ runner.temp }}/acceptance-report/recovery.cms
          if-no-files-found: error
          retention-days: 14

  # Read-only services: no tenant changes, so they run in parallel.
  services:
    name: TestAcc ${{ matrix.service }}
    needs: [plan, auth]
    if: needs.plan.outputs.services_unlocked != '[]'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services_unlocked) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MSTEAMS_LAB_AUTH_METHOD: client-secret
      ACCEPTANCE_TARGET: --service ${{ matrix.service }}
      ACCEPTANCE_LABEL: service-${{ matrix.service }}
    steps: *partition-steps

  # Services with mutations or serialized Global reads. Concurrent policy
  # writes can conflict even with distinct names, so each job holds the
  # tenant-wide lock for its whole read-then-write sequence. queue: max keeps
  # every pending job; an in-flight mutation is never cancelled.
  services-locked:
    name: TestAcc ${{ matrix.service }}
    needs: [plan, auth]
    if: needs.plan.outputs.services_locked != '[]'
    strategy:
      fail-fast: false
      # One locked job per run waits on the lock at a time. Without this a
      # run with many locked partitions overflows the group's pending queue
      # and the excess jobs fail with zero steps.
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services_locked) }}
    concurrency:
      group: msteams-lab-tenant-acceptance
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MSTEAMS_LAB_AUTH_METHOD: client-secret
      ACCEPTANCE_TARGET: --service ${{ matrix.service }}
      ACCEPTANCE_LABEL: service-${{ matrix.service }}
    steps: *partition-steps

  result:
    name: TestAcc result
    if: always()
    needs: [plan, auth, services, services-locked]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download test results
        if: needs.plan.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: gh run download "$RUN_ID" --repo "$REPOSITORY" --pattern 'tenant-acceptance-*' --dir "$RUNNER_TEMP/test-results"
      - name: Show failed tests
        if: always()
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          MSTEAMS_ACC_PLANNED_SERVICES: ${{ needs.plan.outputs.services }}
          JOB_RESULTS: ${{ needs.auth.result }} ${{ needs.services.result }} ${{ needs.services-locked.result }}
        run: |
          if [ "$PLAN_RESULT" = skipped ]; then
            echo "::error::TestAcc did not run for this PR source. Run from a trusted repository branch."
            exit 1
          fi
          # summarize requires one report per expected auth and service step,
          # so a partition skipped by an empty matrix needs no special case.
          python3 tools/acceptance/ci.py summarize --report-directory "$RUNNER_TEMP/test-results"
          for result in $JOB_RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              echo "::error::A TestAcc job failed during setup, tests or cleanup. See its failed step."
              exit 1
            fi
          done
