name: Baseline discovery

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'scripts/discovery/**'
      - 'contracts/**'
      - 'docs/implementation/**'
      - '.github/workflows/baseline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'scripts/discovery/**'
      - 'contracts/**'
      - 'docs/implementation/**'
      - '.github/workflows/baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Test acquisition and failure boundaries
        run: python -m unittest discover -s tools/baseline/tests -v
      - name: Validate approved backlog artifacts
        run: python tools/backlog/validate.py
  pinned-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Extract pinned package twice without tenant credentials
        shell: bash
        run: |
          python tools/baseline/baseline.py --output "$RUNNER_TEMP/first.json"
          python tools/baseline/baseline.py --output "$RUNNER_TEMP/second.json"
          cmp "$RUNNER_TEMP/first.json" "$RUNNER_TEMP/second.json"
      - name: Preserve platform observation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: baseline-${{ matrix.os }}
          path: ${{ runner.temp }}/first.json
          if-no-files-found: error
          retention-days: 14
