name: Upstream release discovery

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Test release selection, candidate validation and draft PR retries
        run: python -m unittest discover -s tools/releases/tests -v

  discover:
    needs: contracts
    if: >-
      github.repository == 'deploymenttheory/go-sdk-msteams' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      found: ${{ steps.candidates.outputs.found }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Discover and verify candidates without tenant credentials
        id: candidates
        shell: bash
        run: |
          python tools/releases/discover.py --output "$RUNNER_TEMP/upstream-candidates"
          if [ -d "$RUNNER_TEMP/upstream-candidates" ]; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: steps.candidates.outputs.found == 'true'
        with:
          name: upstream-candidates
          path: ${{ runner.temp }}/upstream-candidates/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Separate runner: upstream PowerShell never runs with publication permissions.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: upstream-candidates
          path: ${{ runner.temp }}/upstream-candidates
      - name: Recompute reports and maintain draft PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/releases/publish.py --input "$RUNNER_TEMP/upstream-candidates" --repository deploymenttheory/go-sdk-msteams
